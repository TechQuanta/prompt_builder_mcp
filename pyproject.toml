[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt-builder-mcp"
version = "0.1.0"
description = "Deterministic prompt-schema tools for MCP clients."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["fastmcp>=2,<3"]

[project.scripts]
prompt-builder-mcp = "prompt_builder_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
